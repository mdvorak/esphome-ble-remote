name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  schedule:
    - cron: '0 4 * * 6' # Every Saturday at 04:00 UTC
    - cron: '0 4 * * 3' # Every Wednesday at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  esphome_version:
    name: Get ESPHome Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Get ESPHome image tag from Dockerfile
        id: get_tag
        run: |
          TAG=$(grep '^FROM ghcr.io/esphome/esphome:' Dockerfile | head -n1 | cut -d: -f2)
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Using ESPHome version: **${TAG}**" >> $GITHUB_STEP_SUMMARY

  ble_remote:
    name: ESP32 BLE Remote
    runs-on: ubuntu-latest
    needs: esphome_version
    strategy:
      matrix:
        esphome_version:
          - ${{ needs.esphome_version.outputs.tag }}
        esp32_variant:
          - esp32
          - esp32c3
          - esp32s3
        toolchain:
          - platformio
          - esp-idf
        include:
          - esphome_version: "2026.8.0"
            esp32_variant: esp32
            toolchain: platformio
    container:
      image: ghcr.io/esphome/esphome:${{ matrix.esphome_version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set local component path and variant
        uses: mikefarah/yq@v4
        with:
          cmd: |
            yq -i '.external_components[0].source = "./components"' example_ble_remote.yaml
            yq -i '.external_components[0].source = "./components"' example_ble_remote_receiver.yaml
            yq -i '.esp32.variant = "${{ matrix.esp32_variant }}"' example_ble_remote.yaml
            yq -i '.esp32.variant = "${{ matrix.esp32_variant }}"' example_ble_remote_receiver.yaml

      - name: Prepare secrets
        run: |-
          echo "wifi_ssid: TEST" >> secrets.yaml
          echo "wifi_password: testtest" >> secrets.yaml
          echo "ble_remote_shared_key: TEST1234" >> secrets.yaml

      - name: Generate cache key
        run: |-
          echo "ESPHOME_VERSION=$(esphome version)" >> $GITHUB_ENV
          echo "ESPHOME_VER_HASH=$(esphome version | sha256sum | cut -d' ' -f1)" >> $GITHUB_ENV

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |-
            ~/.cache/ccache
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            .esphome/idf/frameworks
            .esphome/idf/penvs
            .esphome/idf/tools/cmake
            .esphome/idf/tools/ninja
            .esphome/idf/tools/esp32ulp-elf
            .esphome/idf/tools/openocd-esp32
          key: ${{ runner.os }}-esphome-${{ env.ESPHOME_VER_HASH }}-${{ matrix.esp32_variant }}-${{ matrix.toolchain }}

      - name: Build ble_remote
        run: |-
          esphome --toolchain "$TOOLCHAIN" compile example_ble_remote.yaml
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}

      - name: Build ble_remote_receiver
        run: |-
          esphome --toolchain "$TOOLCHAIN" compile example_ble_remote_receiver.yaml
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}

      - name: Add build summary
        if: always()
        run: |
          echo "- **ESP32 Variant:** ${{ matrix.esp32_variant }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Toolchain:** ${{ matrix.toolchain }}" >> $GITHUB_STEP_SUMMARY
          echo "- **ESPHome Version:** ${{ env.ESPHOME_VERSION }}" >> $GITHUB_STEP_SUMMARY

  ble_remote_receiver_rp2040:
    name: RP2040 BLE Remote Receiver
    runs-on: ubuntu-latest
    needs: esphome_version
    strategy:
      matrix:
        esphome_version:
          - ${{ needs.esphome_version.outputs.tag }}
    container:
      image: ghcr.io/esphome/esphome:${{ matrix.esphome_version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set local component path
        uses: mikefarah/yq@v4
        with:
          cmd: |
            yq -i '.external_components[0].source = "./components"' example_ble_remote_receiver_rp2040.yaml

      - name: Prepare secrets
        run: |-
          echo "wifi_ssid: TEST" >> secrets.yaml
          echo "wifi_password: testtest" >> secrets.yaml
          echo "ble_remote_shared_key: TEST1234" >> secrets.yaml

      - name: Generate cache key
        run: |-
          echo "ESPHOME_VERSION=$(esphome version)" >> $GITHUB_ENV
          echo "ESPHOME_VER_HASH=$(esphome version | sha256sum | cut -d' ' -f1)" >> $GITHUB_ENV

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |-
            ~/.cache/ccache
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
          key: ${{ runner.os }}-esphome-${{ env.ESPHOME_VER_HASH }}-rp2040

      - name: Build ble_remote_receiver
        run: |-
          esphome compile example_ble_remote_receiver_rp2040.yaml

      - name: Add build summary
        if: always()
        run: |
          echo "- **Platform:** RP2040 (rpipicow)" >> $GITHUB_STEP_SUMMARY
          echo "- **ESPHome Version:** ${{ env.ESPHOME_VERSION }}" >> $GITHUB_STEP_SUMMARY

  build_ok:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - ble_remote
      - ble_remote_receiver_rp2040
    steps:
      - run: echo OK
