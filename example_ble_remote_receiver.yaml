substitutions:
  devicename: ble-remote-receiver
  remote_ble_mac_address: "00:11:22:33:44:55"

esphome:
  name: "${devicename}"
  min_version: 2026.4.0

external_components:
  - source: github://mdvorak/esphome-ble-remote

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:
captive_portal:

ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${devicename}-AP"

esp32_ble_tracker:
  scan_parameters:
    active: false

ble_remote_receiver:
  mac_address: "${remote_ble_mac_address}"
  shared_key: !secret ble_remote_shared_key
  on_toggle:
    - logger.log:
        format: "Command %X received"
        args: [ x ]
    - command: 0x01
      then:
        - logger.log: "Command 01 received"
